[package]
name = "miden-air-definitions"
version = "1.0.0"
description = "Hand-written AIR definitions of the Miden VM processor"
documentation = "https://docs.rs/miden-air-definitions"
categories = ["cryptography", "no-std"]
keywords = ["air", "arithmetization", "crypto", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
bench = false
doctest = false

[features]
default = ["std"]
arbitrary = ["std", "dep:proptest"]
std = ["miden-core/std", "proptest?/std", "rand/std", "rand/thread_rng", "thiserror/std"]
concurrent = ["std", "miden-crypto/concurrent"]
testing = ["arbitrary"]

[dependencies]
# Miden dependencies
miden-ace-codegen.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
miden-utils-indexing.workspace = true

# External dependencies
p3-field.workspace = true
p3-security.workspace = true
proptest = { workspace = true, optional = true }
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
insta.workspace = true
miden-ace-codegen = { workspace = true, features = ["testing"] }
miden-test-serialization-macros.workspace = true
proptest.workspace = true
