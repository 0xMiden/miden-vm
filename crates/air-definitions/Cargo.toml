[package]
name = "miden-air-definitions"
version = "1.0.0"
description = "Handwritten VM and precompile AIR definitions and shared contracts"
documentation = "https://docs.rs/miden-air-definitions"
categories = ["cryptography", "no-std"]
keywords = ["air", "arithmetization", "crypto", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
bench = false
doctest = false

[features]
default = ["std", "compiler"]
compiler = ["miden-ace-codegen/compiler"]
arbitrary = ["std", "dep:proptest"]
std = ["miden-core/std", "proptest?/std", "rand/std", "rand/thread_rng", "thiserror/std", "miden-precompiles/std", "miden-utils-sync/std", "ruint/std"]
concurrent = ["std", "miden-crypto/concurrent"]
testing = ["arbitrary"]

[dependencies]
# Miden dependencies
miden-ace-codegen = { workspace = true, features = ["compiler"] }
miden-core.workspace = true
miden-crypto.workspace = true
miden-utils-indexing.workspace = true
miden-precompiles.workspace = true
miden-utils-sync.workspace = true
miden-lifted-air.workspace = true
miden-lifted-stark.workspace = true
ruint.workspace = true

# External dependencies
p3-field.workspace = true
p3-challenger.workspace = true
p3-dft.workspace = true
p3-symmetric.workspace = true
miden-stateful-hasher.workspace = true
p3-security.workspace = true
proptest = { workspace = true, optional = true }
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
p3-matrix.workspace = true
insta.workspace = true
miden-ace-codegen = { workspace = true, features = ["testing"] }
miden-test-serialization-macros.workspace = true
proptest.workspace = true
