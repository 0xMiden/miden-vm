[package]
name = "miden-mast-package"
version = "0.30.0"
description = "Package containing a compiled Miden MAST artifact with declared dependencies and exports"
documentation = "https://docs.rs/miden-mast-package"
readme = "README.md"
categories = ["compilers", "no-std"]
keywords = ["package", "language", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
bench = false
doctest = false

[[bench]]
name = "package_deserialization"
harness = false

[features]
default = ["std"]
arbitrary = ["std", "dep:proptest", "dep:proptest-derive", "miden-assembly-syntax/arbitrary", "miden-core/arbitrary"]
serde = ["dep:serde"]
std = ["miden-assembly-syntax/std", "miden-core/std", "miden-utils-indexing/std", "rustc-hash/std", "serde?/std", "thiserror/std"]

[dependencies]
# Miden dependencies
miden-assembly-syntax.workspace = true
miden-core.workspace = true
miden-debug-types.workspace = true
miden-utils-indexing.workspace = true

# External dependencies
hashbrown.workspace = true
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
rustc-hash = { version = "2.1", default-features = false }
serde = { workspace = true, optional = true }
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
codspeed-criterion-compat.workspace = true
miden-assembly-syntax = { workspace = true, features = ["arbitrary"] }
miden-core = { workspace = true, features = ["arbitrary"] }
miden-test-serialization-macros.workspace = true
proptest.workspace = true
proptest-derive.workspace = true
