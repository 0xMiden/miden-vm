[package]
name = "midenc-hir-type"
description = "Type system and utilities for Miden HIR"
version = "0.18.0"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/0xMiden/compiler"
categories = ["compilers"]
keywords = ["compiler", "miden"]
license = "MIT"
readme = "README.md"
edition.workspace = true
exclude.workspace = true

[features]
default = ["serde"]
arbitrary = ["dep:proptest", "serde"]
serde = [
  "dep:miden-serde-utils",
  "smallvec/serde",
]
std = ["miden-serde-utils/std"]

[dependencies]
proptest = { workspace = true, optional = true }
miden-formatting.workspace = true
miden-serde-utils = { workspace = true, optional = true }
smallvec = { workspace = true, features = ["drain_filter"] }
thiserror.workspace = true

[dev-dependencies]
miden-test-serialization-macros.workspace = true
# std enables proptest's contextualize_config, so PROPTEST_CASES can scale the
# pinned case counts for one-off high-confidence verification runs.
proptest = { workspace = true, features = ["std"] }
