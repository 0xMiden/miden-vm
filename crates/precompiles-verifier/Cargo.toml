[package]
name = "miden-precompiles-verifier"
version.workspace = true
description = "Verifier for Miden VM precompile proofs"
documentation = "https://docs.rs/miden-precompiles-verifier"
readme = "README.md"
categories = ["cryptography", "no-std"]
keywords = ["miden", "precompile", "verifier", "zkp"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["std"]
concurrent = [
    "std",
    "miden-air/concurrent",
    "miden-air-source/concurrent",
]
constants-tools = ["std"]
std = [
    "dep:miden-ace",
    "miden-air-source/codegen",
    "miden-core/std",
    "miden-crypto/std",
    "miden-air/std",
    "miden-air-source/std",
    "thiserror/std",
]

[dependencies]
miden-ace = { workspace = true, optional = true, features = ["compiler"] }
miden-air.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
miden-stark.workspace = true
miden-air-source.workspace = true
miden-serde-utils.workspace = true
serde.workspace = true
serde-wincode.workspace = true
thiserror.workspace = true
wincode.workspace = true

[[bin]]
name = "pvm-constants-regen"
path = "src/bin/pvm_constants_regen.rs"
required-features = ["constants-tools"]

[dev-dependencies]
insta.workspace = true
miden-air-source = { workspace = true, features = ["codegen"] }
miden-air = { workspace = true, features = ["std"] }
miden-ace = { workspace = true, features = ["testing"] }
