[package]
name = "miden-precompiles-verifier"
version.workspace = true
description = "Verifier for Miden VM precompile proofs"
documentation = "https://docs.rs/miden-precompiles-verifier"
readme = "README.md"
categories = ["cryptography", "no-std"]
keywords = ["miden", "precompile", "verifier", "zkp"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["std"]
concurrent = [
    "std",
    "miden-air/concurrent",
]
std = [
    "dep:miden-ace-codegen",
    "miden-core/std",
    "miden-crypto/std",
    "miden-air/std",
    "thiserror/std",
]

[dependencies]
miden-ace-codegen = { workspace = true, optional = true }
miden-core.workspace = true
miden-crypto.workspace = true
miden-stark.workspace = true
miden-air.workspace = true
miden-serde-utils.workspace = true
serde.workspace = true
serde-wincode.workspace = true
thiserror.workspace = true
wincode.workspace = true

[dev-dependencies]
insta.workspace = true
miden-air = { workspace = true, features = ["std", "compiler"] }
miden-ace-codegen = { workspace = true, features = ["testing"] }
