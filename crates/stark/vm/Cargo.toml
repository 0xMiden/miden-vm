[package]
name = "miden-vm-stark"
version.workspace = true
description = "Miden VM relation STARK backend"
readme = "README.md"
documentation = "https://docs.rs/miden-vm-stark"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
default = ["std"]
std = ["miden-air/std", "miden-air-definitions/std", "miden-core/std", "miden-crypto/std", "miden-stark/std", "thiserror/std"]
concurrent = ["std", "miden-air/concurrent", "miden-stark/concurrent"]
prover = ["dep:tracing"]

[dependencies]
miden-air.workspace = true
miden-air-definitions.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
miden-stark.workspace = true
miden-serde-utils.workspace = true
p3-security.workspace = true
serde.workspace = true
serde-wincode.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
rayon.workspace = true
miden-processor = { workspace = true, features = ["std"] }
miden-assembly.workspace = true
miden-verifier = { workspace = true, features = ["std"] }
miden-core = { workspace = true, features = ["testing"] }
miden-air = { workspace = true, features = ["compiler"] }
miden-air-definitions = { workspace = true, features = ["compiler"] }

[lints]
workspace = true
