[package]
"name" = "miden-vm-stark"
"description" = "Independent VM relation proof product"
"edition" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"license" = { "workspace" = true }
"authors" = { "workspace" = true }
"homepage" = { "workspace" = true }
"repository" = { "workspace" = true }
"version" = { "workspace" = true }

[lib]
"doctest" = false

[features]
"default" = ["std"]
"std" = ["miden-air/std", "miden-air-source/std", "miden-stark/std", "miden-core/std", "miden-crypto/std", "miden-processor?/std", "thiserror/std"]
"concurrent" = ["std", "miden-air/concurrent", "miden-stark/concurrent", "miden-processor?/concurrent"]
"prover" = ["dep:miden-processor"]
"recursive" = []

[dependencies]
"miden-air" = { "workspace" = true }
"miden-air-source" = { "workspace" = true }
"miden-stark" = { "workspace" = true }
"miden-core" = { "workspace" = true }
"miden-crypto" = { "workspace" = true }
"miden-serde-utils" = { "workspace" = true }
"serde" = { "workspace" = true }
"serde-wincode" = { "workspace" = true }
"thiserror" = { "workspace" = true }
"tracing" = { "workspace" = true }
"miden-processor" = { "workspace" = true, "optional" = true }

[dev-dependencies]
"miden-core" = { workspace = true, features = ["testing"] }
"miden-assembly" = { "workspace" = true }
