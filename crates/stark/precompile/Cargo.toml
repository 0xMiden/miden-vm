[package]
"name" = "miden-precompile-stark"
"description" = "Independent precompile relation, traces, proving and verification"
"edition" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"license" = { "workspace" = true }
"authors" = { "workspace" = true }
"homepage" = { "workspace" = true }
"repository" = { "workspace" = true }
"version" = { "workspace" = true }

[lib]
"doctest" = false

[features]
"default" = ["std"]
"std" = ["tracing/std", "miden-air/std", "miden-air-source/std", "miden-stark/std", "miden-core/std", "miden-crypto/std", "miden-precompiles/std", "miden-utils-sync/std", "thiserror/std"]
"concurrent" = ["std", "miden-air/concurrent", "miden-stark/concurrent"]
"trace" = []
"prover" = ["trace"]
"recursive" = ["std"]
"constants-tools" = ["std", "miden-air-source/tooling", "miden-ace/compiler", "miden-stark/capture"]
"fixture-tools" = ["std", "prover"]

[dependencies]
"miden-air" = { "workspace" = true }
"miden-air-source" = { "workspace" = true }
"miden-stark" = { "workspace" = true }
"miden-ace" = { "workspace" = true }
"miden-core" = { "workspace" = true }
"miden-crypto" = { "workspace" = true }
"miden-precompiles" = { "workspace" = true }
"miden-utils-sync" = { "workspace" = true }
"miden-serde-utils" = { "workspace" = true }
"serde" = { "workspace" = true }
"serde-wincode" = { "workspace" = true }
"thiserror" = { "workspace" = true }
"tracing" = { "workspace" = true }
"wincode" = { "workspace" = true }

[dev-dependencies]
"insta" = { "workspace" = true }
"rayon" = { "workspace" = true }
"k256" = { "workspace" = true, "features" = ["arithmetic"] }
"miden-air" = { "workspace" = true, "features" = ["std", "testing"] }
"miden-air-source" = { "workspace" = true, "features" = ["tooling", "testing"] }
"miden-ace" = { "workspace" = true, "features" = ["testing"] }
"proptest" = { "workspace" = true, "features" = ["std"] }
"rand" = { "workspace" = true, "features" = ["std_rng"] }

[[bin]]
name = "pvm-proof-fixture"
path = "src/bin/pvm_proof_fixture.rs"
required-features = ["fixture-tools"]
[[bin]]
name = "pvm-constants-regen"
path = "src/bin/pvm_constants_regen.rs"
required-features = ["constants-tools"]
