[package]
name = "miden-ace"
version = "1.0.0"
description = "ACE circuit runtime and optional compiler for Miden AIRs."
documentation = "https://docs.rs/miden-ace"
readme = "README.md"
categories = ["cryptography"]
keywords = ["air", "arithmetization", "crypto", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[features]
default = []
std = ["miden-crypto/std", "thiserror/std"]
compiler = ["std", "dep:miden-core", "dep:miden-stark", "dep:miden-constraint-compiler"]
testing = ["compiler"]

[dependencies]
miden-stark = { workspace = true, optional = true }
miden-constraint-compiler = { workspace = true, optional = true }
miden-core = { workspace = true, optional = true }
miden-crypto = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
miden-core = { workspace = true, features = ["std"] }
proptest.workspace = true
