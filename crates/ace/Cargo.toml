[package]
name = "miden-ace"
version = "1.0.0"
description = "ACE runtime, circuit compilation, and rendering for Miden AIRs."
documentation = "https://docs.rs/miden-ace"
readme = "README.md"
categories = ["cryptography"]
keywords = ["air", "arithmetization", "crypto", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[features]
default = ["std"]
std = ["miden-core/std", "miden-crypto/std", "thiserror/std"]
compiler = ["std", "dep:miden-constraint-compiler"]
testing = ["compiler"]
arbitrary = ["dep:proptest", "miden-core/arbitrary"]

[dependencies]
proptest = { workspace = true, optional = true }
miden-constraint-compiler = { workspace = true, optional = true }
miden-core = { workspace = true }
miden-crypto = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
miden-test-serialization-macros = { workspace = true }
miden-core = { workspace = true, features = ["std", "arbitrary"] }
proptest.workspace = true
