[package]
name = "miden-ace"
version.workspace = true
description = "ACE circuit runtime and optional compiler for Miden AIRs."
documentation = "https://docs.rs/miden-ace"
readme = "README.md"
categories = ["cryptography"]
keywords = ["air", "arithmetization", "crypto", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[features]
default = []
std = ["miden-crypto/std", "thiserror/std"]
compiler = [
    "std",
    "dep:miden-core",
    "dep:miden-constraint-compiler",
    "dep:miden-stark",
    "dep:p3-dft",
    "miden-core/std",
]
testing = ["compiler"]

[dependencies]
miden-constraint-compiler = { workspace = true, optional = true }
miden-core = { workspace = true, optional = true }
miden-crypto = { workspace = true }
miden-stark = { workspace = true, optional = true }
p3-dft = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
miden-core = { workspace = true, features = ["std"] }
p3-matrix.workspace = true
proptest.workspace = true
