[package]
name = "miden-precompiles-air-definitions"
version.workspace = true
description = "Hand-written AIR definitions of the Miden VM precompile chiplets"
documentation = "https://docs.rs/miden-precompiles-air-definitions"
categories = ["cryptography", "no-std"]
keywords = ["miden", "precompile", "air", "zkp"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
default = ["std"]
concurrent = [
    "std",
    "miden-air-definitions/concurrent",
    "miden-crypto/concurrent",
]
std = [
    "miden-air-definitions/std",
    "miden-core/std",
    "miden-crypto/std",
    "miden-precompiles/std",
    "miden-utils-sync/std",
    "ruint/std",
]
testing = ["miden-air-definitions/testing"]

[dependencies]
miden-ace-codegen.workspace = true
miden-air-definitions.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
miden-lifted-air.workspace = true
miden-precompiles.workspace = true
miden-utils-sync.workspace = true
p3-security.workspace = true
ruint.workspace = true

[dev-dependencies]
miden-air-definitions = { workspace = true, features = ["testing"] }
