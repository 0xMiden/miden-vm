[package]
name = "miden-utils-diagnostics"
version.workspace = true
description = "Diagnostic infrastructure used in the Miden assembler and VM"
documentation = "https://docs.rs/miden-utils-diagnostics"
readme = "README.md"
categories = ["compilers", "no-std"]
keywords = ["diagnostic", "error", "span"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[features]
default = ["std"]
std = ["miden-debug-types/std"]

[dependencies]
miden-debug-types.workspace = true
tracing.workspace = true
unicode-width = { version = "0.2", default-features = false }

[lints]
workspace = true
