[package]
name = "miden-core-lib-codegen"
default-run = "miden-core-lib-codegen"
version.workspace = true
description = "Build-time MASM code generation support for miden-core-lib"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[features]
default = ["std"]
std = ["miden-core/std", "miden-precompiles/std"]
air = ["std", "dep:miden-air-source"]

[lib]
bench = false
doctest = false

[[bin]]
name = "miden-core-lib-codegen"
path = "src/main.rs"
required-features = ["std"]

[[bin]]
name = "verifier-codegen"
path = "src/bin/verifier-codegen.rs"
required-features = ["air"]

[dependencies]
miden-air-source = { workspace = true, optional = true, features = ["tooling"] }
miden-core.workspace = true
miden-precompiles.workspace = true
tempfile = { workspace = true, features = ["getrandom"] }

[dev-dependencies]
serde_json.workspace = true
