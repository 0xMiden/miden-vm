[package]
name = "miden-core-lib"
version.workspace = true
description = "Miden VM core library"
documentation = "https://docs.rs/miden-core-lib"
readme = "README.md"
categories = ["cryptography", "mathematics"]
keywords = ["miden", "program", "core-lib"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
bench = false
doctest = false

[[bench]]
name = "compilation"
harness = false

[[test]]
name = "core-lib"
path = "tests/main.rs"

[features]
default = ["std"]
arbitrary = ["std", "miden-assembly/testing", "miden-utils-testing/arbitrary"]
std = [
    "miden-assembly/std",
    "miden-precompiles/std",
    "miden-processor/std",
    "miden-utils-sync/std",
]
testing = ["arbitrary"]
constraints-tools = [
    "std",
    "dep:miden-air",
    "dep:miden-air-definitions",
    "dep:miden-ace",
    "dep:miden-stark",
    "miden-ace/compiler",
    "miden-air-definitions/compiler",
]

[dependencies]
# Miden dependencies
miden-mast-package.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
miden-precompiles.workspace = true
miden-processor.workspace = true
miden-utils-sync.workspace = true
miden-air = { workspace = true, optional = true }
miden-air-definitions = { workspace = true, optional = true }
miden-ace = { workspace = true, optional = true }
miden-stark = { workspace = true, optional = true }

# External dependencies
p256 = { workspace = true, features = ["ecdsa"] }
thiserror.workspace = true

[dev-dependencies]
miden-vm-stark = { workspace = true, features = ["std"] }
criterion.workspace = true
curve25519-dalek.workspace = true
p3-challenger.workspace = true
miden-ace = { workspace = true, features = ["compiler"] }
miden-air = { workspace = true, features = ["compiler"] }
miden-air-definitions = { workspace = true, features = ["compiler"] }
miden-assembly = { workspace = true, features = ["testing"] }
miden-core-lib-codegen = { workspace = true, features = ["std"] }
miden-debug-types.workspace = true
miden-stark = { workspace = true, features = ["testing"] }
miden-package-registry = { workspace = true, features = ["resolver"] }
miden-processor = { workspace = true, features = ["testing"] }
miden-precompile-stark = { workspace = true, features = ["concurrent", "prover"] }
miden-prover = { workspace = true, features = ["concurrent"] }
miden-utils-testing.workspace = true
miden-verifier = { workspace = true, features = ["std"] }
num = { workspace = true }
p3-security.workspace = true
rand = { workspace = true, features = ["std", "std_rng", "thread_rng"] }
rand_chacha = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[build-dependencies]
env_logger.workspace = true
fs-err = { version = "3.1" }
miden-assembly = { workspace = true, features = ["std"] }
miden-assembly-syntax = { workspace = true, features = ["std"] }
miden-package-registry = { workspace = true, features = ["resolver"] }
miden-core-lib-codegen = { workspace = true, features = ["std"] }

[[bin]]
name = "regenerate-constraints"
path = "src/bin/regenerate-constraints.rs"
required-features = ["constraints-tools"]
