[package]
"name" = "miden-core-lib"
"version" = "1.0.0"
"description" = "Miden VM core library"
"documentation" = "https://docs.rs/miden-core-lib"
"readme" = "README.md"
"categories" = ["cryptography", "mathematics"]
"keywords" = ["miden", "program", "core-lib"]
"license" = { "workspace" = true }
"authors" = { "workspace" = true }
"homepage" = { "workspace" = true }
"repository" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"edition" = { "workspace" = true }

[lib]
"bench" = false
"doctest" = false

[[bench]]
"name" = "compilation"
"harness" = false

[[test]]
"name" = "core-lib"
"path" = "tests/main.rs"

[features]
"default" = ["std"]
"arbitrary" = ["std", "miden-assembly/testing", "miden-utils-testing/arbitrary"]
"std" = ["miden-assembly/std", "miden-precompiles/std", "miden-processor/std", "miden-utils-sync/std"]
"testing" = ["arbitrary"]

[dependencies]
"miden-mast-package" = { "workspace" = true }
"miden-core" = { "workspace" = true }
"miden-crypto" = { "workspace" = true }
"miden-precompiles" = { "workspace" = true }
"miden-processor" = { "workspace" = true }
"miden-utils-sync" = { "workspace" = true }
"p256" = { "workspace" = true, "features" = ["ecdsa"] }
"thiserror" = { "workspace" = true }

[dev-dependencies]
"miden-air-source" = { workspace = true, features = ["tooling"] }
"criterion" = { "workspace" = true }
"curve25519-dalek" = { "workspace" = true }
"miden-air" = { "workspace" = true }
"miden-assembly" = { "workspace" = true, "features" = ["testing"] }
"miden-core-lib-codegen" = { "workspace" = true, "features" = ["std"] }
"miden-debug-types" = { "workspace" = true }
"miden-package-registry" = { "workspace" = true, "features" = ["resolver"] }
"miden-processor" = { "workspace" = true, "features" = ["testing"] }
"miden-utils-testing" = { "workspace" = true }
"num" = { "workspace" = true }
"p3-security" = { "workspace" = true }
"rand" = { "workspace" = true, "features" = ["std", "std_rng", "thread_rng"] }
"rand_chacha" = { "workspace" = true }
"rstest" = { "workspace" = true }
"tokio" = { "workspace" = true, "features" = ["macros", "rt"] }
"miden-stark" = { "workspace" = true, "features" = ["testing"] }
"miden-ace" = { "workspace" = true, "features" = ["compiler"] }
"miden-vm" = { "workspace" = true, "features" = ["concurrent", "prover", "std", "recursive"] }
"miden-precompile-stark" = { "workspace" = true, "features" = ["concurrent", "prover", "recursive"] }

[build-dependencies]
"env_logger" = { "workspace" = true }
"fs-err" = { "version" = "3.1" }
"miden-assembly" = { "workspace" = true, "features" = ["std"] }
"miden-assembly-syntax" = { "workspace" = true, "features" = ["std"] }
"miden-package-registry" = { "workspace" = true, "features" = ["resolver"] }
"miden-core-lib-codegen" = { "workspace" = true, "features" = ["std"] }
