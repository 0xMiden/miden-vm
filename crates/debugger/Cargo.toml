[package]
name = "miden-debug"
description = "An interactive debugger for Miden VM programs"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/miden-debug"
categories = ["development-tools"]
keywords = ["miden", "debugger"]
license = "MIT"
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "miden-debug"
path = "src/main.rs"
test = false
bench = false
required-features = ["std"]

[[bin]]
name = "miden-debug-python"
path = "src/main.rs"
test = false
bench = false
required-features = ["python", "repl"]

[[test]]
name = "println_smoke_test"
required-features = ["std"]

[[test]]
name = "println_empty_string"
required-features = ["std"]

[[test]]
name = "println_invalid_utf8"
required-features = ["std"]

[[test]]
name = "println_oversized_length"
required-features = ["std"]

[[test]]
name = "println_uninitialized_memory"
required-features = ["std"]

[[test]]
name = "println_multiple_prints"
required-features = ["std"]

[[test]]
name = "flamegraph_profile"
required-features = ["flamegraph"]

[features]
default = ["std", "tui", "dap", "repl", "flamegraph"]
flamegraph = ["std", "dep:inferno"]
tui = ["std", "dep:crossterm", "dep:futures-util", "dep:ratatui", "dep:signal-hook", "dep:syntect", "dep:tokio", "dep:tokio-util", "dep:tui-input"]
script = ["std"]
repl = ["script", "dep:rustyline"]
dap = ["std", "miden-debug-engine/dap"]
python = ["script", "dep:pyo3", "dep:pyo3-build-config"]
std = ["dep:env_logger", "clap/std", "clap/env", "compact_str/std", "miden-assembly-syntax/std", "miden-debug-engine/std"]
proptest = ["miden-debug-engine/proptest"]

[dependencies]
clap = { workspace = true, features = ["env"] }
crossterm = { version = "0.29.0", optional = true, features = ["event-stream"] }
compact_str = { version = "0.9", optional = true, default-features = false }
miden-debug-engine.workspace = true
env_logger = { workspace = true, optional = true }
inferno = { version = "0.12", optional = true, default-features = false }
log.workspace = true
miden-assembly = { workspace = true, features = ["std"] }
miden-assembly-syntax.workspace = true
miden-core.workspace = true
miden-debug-types.workspace = true
miden-mast-package.workspace = true
miden-package-registry = { workspace = true, features = ["resolver"] }
miden-processor.workspace = true
miden-project.workspace = true
pyo3 = { version = "0.30.1", optional = true, features = ["auto-initialize"] }
ratatui = { version = "0.30.0", optional = true }
signal-hook = { version = "0.3", optional = true, default-features = false }
syntect = { version = "5.2.0", optional = true, default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }
thiserror.workspace = true
tui-input = { version = "0.15", optional = true }
rustyline = { version = "19.0", optional = true, default-features = false }
tokio = { workspace = true, optional = true, features = ["rt", "time", "macros"] }
tokio-util = { version = "0.7.11", optional = true }
futures-util = { version = "0.3.30", optional = true, default-features = false }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
pyo3-build-config = { version = "0.30.1", optional = true, features = ["resolve-config"] }
