name = "miden-debug"

# Only `*.test` files are test entry points. The `*.masm` programs they debug
# sit alongside them as fixtures and are not themselves discovered as tests.
patterns = ["*.test"]

working_dir = "."

[substitutions]
# The debugger and private fixture builders resolve via the directory passed to
# `litcheck lit run --path` (see `make test-debugger-lit` in the workspace).
# `filecheck` is provided by litcheck itself.
