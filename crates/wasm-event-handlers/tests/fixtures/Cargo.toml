# A standalone workspace for the Wasm guest fixtures of the `miden-wasm-event-handlers` end-to-end
# tests.
#
# The fixtures are kept out of the main workspace on purpose: they compile only for their real
# target (wasm32), so they need no host-build cfg-gating, and they are not part of workspace
# linting or formatting. Each handler-fixture workspace stands alone with its own lockfile (the
# project-assembler tests hold another one), so add new fixture crates for these tests as members
# here.
[workspace]
resolver = "3"
members = ["guest"]
