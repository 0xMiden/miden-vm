[package]
name = "miden-constraint-compiler"
version.workspace = true
description = "Constraint compiler for Plonky3-based Miden AIRs."
documentation = "https://docs.rs/miden-constraint-compiler"
readme = "README.md"
categories = ["cryptography"]
keywords = ["air", "arithmetization", "compiler", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[features]
testing = ["dep:p3-field"]
default = ["std"]
std = ["miden-core/std", "miden-crypto/std", "miden-stark/std"]

[dependencies]
p3-field = { workspace = true, optional = true }
hashbrown.workspace = true
miden-core = { workspace = true }
miden-crypto = { workspace = true }
miden-stark = { workspace = true }

[dev-dependencies]
miden-core = { workspace = true, features = ["std"] }
p3-field = { workspace = true }
