[package]
name = "miden-debug-dap"
description = "In-repo Debug Adapter Protocol support for miden-debug"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/miden-debug-dap"
categories = ["development-tools"]
keywords = ["miden", "debugger"]
license = "MIT"
edition.workspace = true

[lib]
name = "dap"

[features]
integration_testing = ["dep:fake", "dep:rand"]
client = []

[dependencies]
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror.workspace = true
fake = { version = "5.*", features = ["derive"], optional = true }
rand = { workspace = true, optional = true, features = ["std", "thread_rng"] }
