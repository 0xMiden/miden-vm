[package]
name = "miden-air-source"
version.workspace = true
description = "Authored VM and precompile AIR equations, schemas, and generation tools"
documentation = "https://docs.rs/miden-air-source"
readme = "README.md"
categories = ["cryptography", "no-std"]
keywords = ["air", "arithmetization", "crypto", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
bench = false
doctest = false

[[bin]]
name = "air-artifacts"
path = "src/bin/air-artifacts.rs"
required-features = ["tooling", "std"]

[features]
default = ["std"]
arbitrary = ["std", "dep:proptest"]
std = ["miden-core/std", "miden-crypto/std", "miden-stark/std", "miden-ace/std", "miden-precompiles/std", "miden-utils-sync/std", "ruint/std", "proptest?/std", "thiserror/std"]
concurrent = ["std", "miden-crypto/concurrent", "miden-stark/concurrent"]
testing = ["arbitrary"]
tooling = ["dep:askama", "dep:miniz_oxide", "dep:serde_json", "dep:sha2", "std", "miden-stark/capture", "miden-ace/compiler"]

[dependencies]
askama = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
miden-ace.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
miden-stark.workspace = true
miden-precompiles.workspace = true
miden-utils-indexing.workspace = true
miden-utils-sync.workspace = true
p3-field.workspace = true
p3-security.workspace = true
proptest = { workspace = true, optional = true }
ruint.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
miden-test-serialization-macros.workspace = true
proptest.workspace = true
