[package]
name = "miden-precompiles-air"
version.workspace = true
description = "AIR and shared proof setup for Miden VM precompiles"
documentation = "https://docs.rs/miden-precompiles-air"
categories = ["cryptography", "no-std"]
keywords = ["miden", "precompile", "air", "zkp"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["std"]
concurrent = ["std", "miden-air-definitions/concurrent", "miden-lifted-stark/concurrent"]
std = ["miden-air-definitions/std"]
testing = ["miden-air-definitions/testing"]

[dependencies]
miden-air-definitions = { workspace = true, features = ["compiler"] }
miden-lifted-stark.workspace = true
