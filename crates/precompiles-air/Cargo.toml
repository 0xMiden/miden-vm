[package]
name = "miden-precompiles-air"
version.workspace = true
description = "AIR and shared proof setup for Miden VM precompiles"
documentation = "https://docs.rs/miden-precompiles-air"
categories = ["cryptography", "no-std"]
keywords = ["miden", "precompile", "air", "zkp"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["std"]
concurrent = [
    "miden-precompiles-air-definitions/concurrent",
    "std",
    "miden-air/concurrent",
    "miden-crypto/concurrent",
    "miden-lifted-stark/concurrent",
]
std = [
    "miden-precompiles-air-definitions/std",
    "miden-air/std",
    "miden-core/std",
    "miden-crypto/std",
]
testing = ["miden-precompiles-air-definitions/testing", "miden-air/testing"]

[package.metadata.cargo-shear]
# The build-generated constraint evaluators import `p3_field::Dup`.
ignored = ["p3-field"]

[dependencies]
miden-precompiles-air-definitions.workspace = true
miden-air.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
miden-lifted-air.workspace = true
miden-lifted-stark.workspace = true
p3-field.workspace = true
p3-security.workspace = true

[dev-dependencies]
miden-constraint-compiler.workspace = true
miden-air = { workspace = true, features = ["testing"] }

[build-dependencies]
miden-precompiles-air-definitions = { workspace = true, features = ["std"] }
miden-ace-codegen.workspace = true
miden-constraint-compiler.workspace = true
miden-core.workspace = true
