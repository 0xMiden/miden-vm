name: Publish workspace to crates.io

# Keep this workflow file and name stable: crates.io trusted publishing is
# configured against the GitHub workflow identity. The manual path below is the
# release path because it stages assets on a draft before anything is public.
# Tag rulesets may require deployment to the release environment and may make
# tags immutable, so failures below print recovery commands instead of suggesting
# force-pushing, deleting, or moving a tag.
#
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release (e.g. v0.12.0)"
        required: true
        type: string
      packages:
        description: "Comma, space, or newline separated packages to publish. Empty publishes all publishable workspace packages."
        required: false
        default: ""
        type: string
      allow_existing:
        description: "Resume a partial publish after checking existing crates."
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: workspace-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: prepare release metadata
    if: ${{ github.repository_owner == '0xMiden' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # Read required reviewers on the release environment.
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
      branch: ${{ steps.prepare.outputs.branch }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pin the dispatched commit so artifacts and attestations share the
          # run's source identity. Reject it if the branch has since advanced.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve and validate release commit
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/prepare-release.sh

  package-version-gate:
    name: check package versions
    needs: prepare-release
    if: ${{ github.repository_owner == '0xMiden' }}
    permissions:
      contents: read
    uses: ./.github/workflows/package-version-gate.yml
    with:
      ref: ${{ github.sha }}
      packages: ${{ inputs.packages }}
      allow_existing: ${{ inputs.allow_existing }}

  create-draft:
    name: create draft release
    needs: [prepare-release, package-version-gate, upload-artifacts, verify-packages]
    if: ${{ github.repository_owner == '0xMiden' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Revalidate release refs before creating the draft
        env:
          RELEASE_BRANCH: ${{ needs.prepare-release.outputs.branch }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: ./scripts/verify-release-refs.sh

      - name: Create or validate draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          RELEASE_BRANCH: ${{ needs.prepare-release.outputs.branch }}
          RELEASE_PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          set -euo pipefail

          is_draft="$( { gh release view "${RELEASE_TAG}" --json isDraft -q .isDraft; } 2>/dev/null || echo "release not found" )"
          case "${is_draft}" in
            true)
              draft_sha="$(gh release view "${RELEASE_TAG}" --json targetCommitish -q .targetCommitish)"
              if [[ "${draft_sha}" != "${RELEASE_SHA}" ]]; then
                echo "::error::Draft ${RELEASE_TAG} targets ${draft_sha}, expected ${RELEASE_SHA}."
                echo "::error::Do not retarget the tag or draft. Update the release version and redispatch from ${RELEASE_BRANCH}."
                exit 1
              fi
              ;;
            false)
              echo "::error::Release ${RELEASE_TAG} is already published. Refusing to mutate public release assets."
              echo "::error::Convert the release back to draft if permitted, then redispatch from ${RELEASE_BRANCH}. Otherwise cut a new version."
              exit 1
              ;;
            "release not found")
              gh release create "${RELEASE_TAG}" \
                --draft \
                --target "${RELEASE_SHA}" \
                --title "${RELEASE_TAG}" \
                --latest=false \
                --prerelease="${RELEASE_PRERELEASE}"
              ;;
            *)
              echo "::error::Unexpected draft state for ${RELEASE_TAG}: ${is_draft}"
              echo "::error::Retry after checking the release manually: gh release view ${RELEASE_TAG} --repo ${GH_REPO}"
              echo "::error::If no release exists, redispatch from ${RELEASE_BRANCH}."
              exit 1
              ;;
          esac

  upload-artifacts:
    name: upload pre-built miden-vm executable artifacts
    needs: [prepare-release, package-version-gate]
    if: ${{ github.repository_owner == '0xMiden' }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        target: [aarch64-apple-darwin, x86_64-unknown-linux-gnu]
        exclude:
          - os: macos-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/cleanup-runner
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - name: Add target
        run: |
          rustup target add ${{ matrix.target }}
      - name: Build miden-vm
        run: |
          BUILD_TARGET=${{ matrix.target }} make exec-dist
      - name: Prepare artifact
        run: |
          mkdir release-assets
          mv target/${{ matrix.target }}/optimized/miden-vm release-assets/miden-vm-${{ matrix.target }}
          mv target/${{ matrix.target }}/optimized/miden-format release-assets/miden-format-${{ matrix.target }}
          mv target/${{ matrix.target }}/optimized/miden-registry release-assets/miden-registry-${{ matrix.target }}
      # Since the MASM packages are triplet independent, we only build them once.
      - name: Build MASM packages
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          make packages
      - name: Prepare MASM package artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mv target/packages/miden-core.masp release-assets/core.masp
      - name: Save release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true

  stage-artifacts:
    name: attest and upload release artifacts
    needs: [prepare-release, upload-artifacts, create-draft]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binaries-*
          merge-multiple: true
          path: release-assets
      # Attest bytes from this run without granting OIDC access to compilation.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Upload draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$RELEASE_TAG" release-assets/*

      - name: Create or verify immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_BRANCH: ${{ needs.prepare-release.outputs.branch }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
        # The create-draft deployment has completed before tag creation.
        run: |
          set -euo pipefail
          ./scripts/verify-release-refs.sh
          refs="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
          if [[ -z "$refs" ]]; then
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${RELEASE_SHA}"
          fi
          ./scripts/verify-release-tag.sh

  verify-packages:
    name: verify release packages without publication credentials
    needs: [prepare-release, package-version-gate]
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/workspace-release
        if: needs.package-version-gate.outputs.packages != '[]'
        with:
          packages: ${{ join(fromJSON(needs.package-version-gate.outputs.packages), ' ') }}

  publish:
    name: publish workspace crates
    needs: [prepare-release, package-version-gate, verify-packages, stage-artifacts]
    if: ${{ github.repository_owner == '0xMiden' }}
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_BRANCH: ${{ needs.prepare-release.outputs.branch }}
      RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    permissions:
      contents: read
      id-token: write # Required for OIDC token exchange with crates.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure Cargo before authentication
        run: ./scripts/prepare-crates-publication.sh

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish workspace crates
        if: needs.package-version-gate.outputs.packages != '[]'
        uses: ./.github/actions/workspace-release
        with:
          mode: publish
          packages: ${{ join(fromJSON(needs.package-version-gate.outputs.packages), ' ') }}
          token: ${{ steps.auth.outputs.token }}

  publish-github-release:
    name: publish GitHub release
    needs: [prepare-release, publish]
    if: ${{ github.repository_owner == '0xMiden' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
          RELEASE_BRANCH: ${{ needs.prepare-release.outputs.branch }}
        run: |
          set -euo pipefail

          ./scripts/verify-release-tag.sh
          release_id="$(gh release view "${RELEASE_TAG}" --json databaseId -q .databaseId)"
          gh api \
            --method PATCH \
            "repos/${GH_REPO}/releases/${release_id}" \
            -F draft=false \
            -F "prerelease=${RELEASE_PRERELEASE}" \
            -f "make_latest=$([[ "$RELEASE_BRANCH" == main ]] && echo true || echo false)"
