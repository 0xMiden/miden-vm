name: codspeed

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vm:
    name: Build VM CodSpeed benchmarks
    runs-on: warp-ubuntu-latest-arm64-8x
    # CodSpeed macro runners use ARM64 Ubuntu 22.04. Build with the same libc.
    container:
      image: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    permissions:
      contents: read
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git libssl-dev pkg-config

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "${RUNNER_TEMP}/rustup-init.sh"
          sh "${RUNNER_TEMP}/rustup-init.sh" -y --no-modify-path --profile minimal --default-toolchain "${toolchain}"
          /usr/local/cargo/bin/rustup target add wasm32-unknown-unknown
          echo /usr/local/cargo/bin >> "${GITHUB_PATH}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: codspeed-vm

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 4.6.0 --locked

      - name: Build benchmark
        run: |
          cargo codspeed build --locked --measurement-mode walltime --profile optimized -p miden-vm-synthetic-bench --bench synthetic_bench
          cargo codspeed build --locked --measurement-mode walltime --profile optimized -p miden-vm-precompiles-bench --bench pvm_bench

      - name: Pack executable
        run: |
          set -euo pipefail
          test -x target/codspeed/walltime/miden-vm-synthetic-bench/synthetic_bench
          test -x target/codspeed/walltime/miden-vm-precompiles-bench/pvm_bench
          tar -C target/codspeed -czf vm-codspeed.tar.gz walltime/miden-vm-synthetic-bench walltime/miden-vm-precompiles-bench

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-codspeed
          path: vm-codspeed.tar.gz
          if-no-files-found: error
          retention-days: 1

  vm:
    name: Run CodSpeed benchmarks (${{ matrix.name }})
    needs: build-vm
    runs-on: codspeed-macro
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: synthetic
            package: miden-vm-synthetic-bench
            bench: synthetic_bench
          - name: PVM
            package: miden-vm-precompiles-bench
            bench: pvm_bench
    permissions:
      contents: read
      id-token: write
    env:
      RAYON_NUM_THREADS: "8"
      SYNTH_BENCH_AXES: exec,trace_prep,prove,verify
      SYNTH_MEASUREMENT_TIME_SECS: "1"
      SYNTH_SAMPLE_SIZE: "10"
      SYNTH_WARM_UP_TIME_SECS: "1"
      SYNTH_SCENARIO: create-single-p2id-note
      # Use this job's snapshot path rather than the compiled manifest path.
      SYNTH_SNAPSHOT: ${{ github.workspace }}/benches/synthetic-bench/snapshots/bench-tx.json
      PVM_BENCH_ECDSAS: "1"
      PVM_BENCH_KECCAKS: "0"
      PVM_BENCH_AXES: prove,verify
      PVM_BENCH_MEASUREMENT_SECS: "1"
      PVM_BENCH_SAMPLE_SIZE: "10"
      PVM_BENCH_WARM_UP_SECS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "${toolchain}" --profile minimal

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 4.6.0 --locked

      - name: Download executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-codspeed

      - name: Unpack executable
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -p target/codspeed
          tar -C target/codspeed -xzf vm-codspeed.tar.gz
          test -x target/codspeed/walltime/${{ matrix.package }}/${{ matrix.bench }}

      - name: Run benchmark
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: walltime
          run: cargo codspeed run --measurement-mode walltime -p ${{ matrix.package }} --bench ${{ matrix.bench }}

  smt:
    name: Run CodSpeed benchmarks (SMT)
    runs-on: codspeed-macro
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "${toolchain}" --profile minimal --target wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 4.6.0 --locked

      - name: Build benchmark
        run: cargo codspeed build --locked --measurement-mode walltime --profile optimized -p miden-crypto-smt-codspeed-bench --bench smt_codspeed

      - name: Run benchmark
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: walltime
          run: cargo codspeed run --measurement-mode walltime -p miden-crypto-smt-codspeed-bench --bench smt_codspeed
