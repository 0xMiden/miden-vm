name: codspeed

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codspeed:
    name: Run CodSpeed benchmarks (${{ matrix.name }})
    runs-on: codspeed-macro
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: synthetic
            package: miden-vm-synthetic-bench
            bench: synthetic_bench
            timeout: 60
          - name: SMT
            package: miden-crypto-smt-codspeed-bench
            bench: smt_codspeed
            timeout: 30
    permissions:
      contents: read
      id-token: write
    env:
      RAYON_NUM_THREADS: "8"
      SYNTH_BENCH_AXES: exec,trace_prep,prove,verify
      SYNTH_MEASUREMENT_TIME_SECS: "1"
      SYNTH_SAMPLE_SIZE: "10"
      SYNTH_WARM_UP_TIME_SECS: "1"
      SYNTH_SCENARIO: create-single-p2id-note
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "${toolchain}" --profile minimal --target wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-codspeed
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-codspeed --version 4.6.0 --locked

      - name: Build benchmarks
        shell: bash
        run: |
          set -euo pipefail
          cargo codspeed build --measurement-mode walltime --profile optimized -p ${{ matrix.package }} --bench ${{ matrix.bench }}

      - name: Run benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286 # v4.18.5
        with:
          mode: walltime
          run: |
            cargo codspeed run --measurement-mode walltime -p ${{ matrix.package }} --bench ${{ matrix.bench }}
