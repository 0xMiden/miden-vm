name: Workspace release dry-run

on:
  push:
    branches:
      - main
      - next
      - release/v*
      - release-v*
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma, space, or newline separated packages to dry-run. Empty dry-runs all publishable workspace packages."
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  release-dry-run:
    if: ${{ github.repository_owner == '0xMiden' }}
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Build MASM packages
        run: |
          make packages

      - name: Check package selection
        id: plan
        env:
          RELEASE_PACKAGES: ${{ inputs.packages || '' }}
        run: scripts/check-package-release-plan.sh --skip-semver --allow-existing=true "$RELEASE_PACKAGES"

      - name: Dry-run workspace release
        if: steps.plan.outputs.packages != '[]'
        uses: ./.github/actions/workspace-release
        with:
          packages: ${{ join(fromJSON(steps.plan.outputs.packages), ' ') }}
