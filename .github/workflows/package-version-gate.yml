name: Package version gate

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - next
      - release/v*
      - release-v*
  workflow_call:
    outputs:
      packages:
        description: "JSON array of checked packages that need publication."
        value: ${{ jobs.package-versions.outputs.packages }}
    inputs:
      ref:
        description: "Git ref or SHA to check. Empty checks the caller ref."
        required: false
        default: ""
        type: string
      packages:
        description: "Comma, space, or newline separated packages to check. Empty checks all publishable workspace packages."
        required: false
        default: ""
        type: string
      allow_existing:
        description: "Allow crate versions that already exist on crates.io."
        required: false
        default: true
        type: boolean
      skip_checks:
        description: "Generate a publication plan without version, archive or semver validation for manual recovery. Requires explicit packages."
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma, space, or newline separated packages to check. Empty checks all publishable workspace packages."
        required: false
        default: ""
        type: string
      allow_existing:
        description: "Allow crate versions that already exist on crates.io."
        required: false
        default: true
        type: boolean

concurrency:
  # Isolate manual runs without putting their full package selections in the key.
  # Push checks still cancel an older check for the same ref.
  group: "${{ github.workflow }} @ ${{ github.event_name }} @ ${{ inputs.ref || github.ref }} @ ${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}"
  cancel-in-progress: true

jobs:
  package-versions:
    if: ${{ github.repository_owner == '0xMiden' }}
    runs-on: warp-ubuntu-latest-x64-8x
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    env:
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install cargo-semver-checks
        if: ${{ !inputs.skip_checks }}
        # Rust 1.99 emits rustdoc JSON v61, supported by cargo-semver-checks 0.51.
        run: cargo install cargo-semver-checks --version 0.51.0 --locked

      - name: Check package versions
        id: plan
        run: |
          args=("--allow-existing=$PACKAGE_VERSION_GATE_ALLOW_EXISTING")
          if [[ "$PACKAGE_VERSION_GATE_SKIP_CHECKS" == true ]]; then
            args+=(--skip-checks)
          fi
          bash scripts/check-package-release-plan.sh "${args[@]}" "$PACKAGE_VERSION_GATE_PACKAGES"
        env:
          PACKAGE_VERSION_GATE_PACKAGES: ${{ inputs.packages || '' }}
          PACKAGE_VERSION_GATE_ALLOW_EXISTING: ${{ github.event_name == 'push' || inputs.allow_existing }}
          PACKAGE_VERSION_GATE_SKIP_CHECKS: ${{ inputs.skip_checks || false }}
