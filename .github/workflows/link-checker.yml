# Checks local documentation links on pull requests and external links once per day.
name: Check documentation links

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_call:
    inputs:
      fail-fast:
        required: false
        default: false
        type: boolean
  schedule:
    # runs once a day at 01:00 UTC (adjust as needed)
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions: {}

jobs:
  localLinks:
    name: Check local documentation links
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check local documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: |
            --offline
            --include-fragments
            **/*.md

  linkChecker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set fail-fast flag depending on trigger
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "fail_fast=false" >> "$GITHUB_OUTPUT"
          else
            echo "fail_fast=${{ inputs.fail-fast }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: ${{ steps.flags.outputs.fail_fast }}
          args: |
            --verbose
            --exclude "localhost"
            --exclude "127.0.0.1"
            --exclude "^file://"
            --exclude "github.com/0xMiden/.*"
            --exclude "medium.com"
            --exclude "^https://eprint[.]iacr[.]org/"
            docs/src/**/*.md
            **/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if lychee did not produce a link report
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          if [ ! -s ./lychee/out.md ] || ! grep -q '^# Summary' ./lychee/out.md; then
            echo "::error::lychee exited before producing a link-check summary. Check the Link Checker step for a workflow or tool configuration error."
            exit 1
          fi

      - name: Report broken links (only if fail-fast is false)
        if: steps.lychee.outputs.exit_code != '0' && steps.flags.outputs.fail_fast != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ./lychee/out.md
        with:
          script: |
            const fs = require('fs');
            const title = 'Link Checker Report';
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'asc',
              per_page: 100,
            });
            const existingIssue = openIssues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['documentation'],
              });
            }
