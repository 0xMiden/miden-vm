name: test

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: test on warpbuild
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      # Do not pin taiki-e's moving tool shortcut tags by hash. Pin a released
      # install-action commit and set tool explicitly, or zizmor's
      # impostor-commit audit can flag stale shortcut-tag hashes.
      - name: Install nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Build tests
        run: make test-build NEXTEST_PROFILE=ci
      - name: test
        run: make test NEXTEST_PROFILE=ci

  crypto-test:
    name: crypto test on warpbuild
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Run crypto tests
        run: make test-crypto

  eidos-x86-backends:
    name: Eidos ${{ matrix.backend }} backend
    runs-on: warp-ubuntu-latest-x64-8x
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: AVX2
            target_features: +avx2,-avx512f
            required_cpu_features: avx2
            forbidden_target_features: avx512f
          - backend: AVX-512
            target_features: +avx2,+avx512f
            required_cpu_features: avx2 avx512f
            forbidden_target_features: ""
    env:
      RUSTFLAGS: -C target-feature=${{ matrix.target_features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner CPU features
        env:
          REQUIRED_CPU_FEATURES: ${{ matrix.required_cpu_features }}
        run: |
          set -euo pipefail

          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::Eidos ${{ matrix.backend }} tests require an x86-64 runner"
            exit 1
          fi

          lscpu
          cpu_features=" $(awk -F: '/^flags[[:space:]]*:/{print $2; exit}' /proc/cpuinfo) "
          for feature in ${REQUIRED_CPU_FEATURES}; do
            if [[ "${cpu_features}" != *" ${feature} "* ]]; then
              echo "::error::Runner does not expose required CPU feature '${feature}'"
              exit 1
            fi
          done
          echo "Runner supports Eidos ${{ matrix.backend }} execution"
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Install nextest
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest
      - name: Verify selected Rust backend
        env:
          FORBIDDEN_TARGET_FEATURES: ${{ matrix.forbidden_target_features }}
          REQUIRED_TARGET_FEATURES: ${{ matrix.required_cpu_features }}
          TARGET_FEATURES: ${{ matrix.target_features }}
        run: |
          set -euo pipefail

          rust_cfg="$(rustc --print cfg -C "target-feature=${TARGET_FEATURES}")"
          printf '%s\n' "${rust_cfg}"
          for feature in ${REQUIRED_TARGET_FEATURES}; do
            if ! grep -Fqx "target_feature=\"${feature}\"" <<<"${rust_cfg}"; then
              echo "::error::Rust did not enable required target feature '${feature}'"
              exit 1
            fi
          done
          for feature in ${FORBIDDEN_TARGET_FEATURES}; do
            if grep -Fqx "target_feature=\"${feature}\"" <<<"${rust_cfg}"; then
              echo "::error::Rust unexpectedly enabled target feature '${feature}'"
              exit 1
            fi
          done
          echo "Selected Eidos backend: ${{ matrix.backend }}"
      - name: Run Eidos backend equivalence and vector tests
        run: cargo nextest run --profile ci -p miden-crypto --lib --no-tests=fail 'hash::eidos::'

  doc-tests:
    name: doc-tests
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Run doc-tests
        run: make test-docs

  check-core-lib-docs:
    name: check core library docs
    runs-on: warp-ubuntu-latest-x64-8x
    needs: [test, doc-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Build core library and generate documentation
        run: |
          # Build core library with documentation generation enabled
          MIDEN_BUILD_LIB_DOCS=1 cargo build -p miden-core-lib
      - name: Check for documentation changes in crates/lib/core/docs
        run: |
          if [ -n "$(git status --porcelain crates/lib/core/docs)" ]; then
            echo "ERROR: Found uncommitted changes in crates/lib/core/docs/"
            echo "This indicates that the assembly source code has changed but the documentation was not updated."
            echo "Please commit the generated documentation changes before merging."
            echo ""
            echo "To fix this:"
            echo "1. Run: MIDEN_BUILD_LIB_DOCS=1 cargo build -p miden-core-lib"
            echo "2. Commit the changes in crates/lib/core/docs/"
            echo ""
            echo "Uncommitted changes:"
            git status crates/lib/core/docs
            echo ""
            echo "Diff:"
            git diff crates/lib/core/docs
            exit 1
          else
            echo "No documentation changes in crates/lib/core/docs/ - OK"
          fi

  check-constraints:
    name: check recursive constraint and PVM ACE artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Check recursive constraint artifacts for drift
        run: make check-constraints
      - name: Check PVM ACE constants and MASM artifacts for drift
        run: make check-pvm-constants

  run-examples:
    name: run masm examples
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Run masm examples
        run: make run-examples

  check-features:
    name: check all feature combinations
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      # Keep this on a released install-action commit with an explicit tool; see
      # the nextest install above for the zizmor/tool-shortcut rationale.
      - name: Install cargo-hack
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-hack
      - name: Check all feature combinations
        run: make check-features
