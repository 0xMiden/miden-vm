name: test

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-eidos-paths:
    name: Classify Eidos paths
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for Eidos-related changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          run=false
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            run=true
          else
            while IFS= read -r -d '' path; do
              case "${path}" in
                .cargo/*|.config/nextest.toml|.github/actions/cleanup-runner/*|\
                .github/workflows/test.yml|Cargo.lock|Cargo.toml|rust-toolchain.toml|\
                crates/crypto/*|crates/crypto-derive/*|crates/field/*|crates/lifted-air/*|\
                crates/lifted-stark/*|crates/serde-utils/*|crates/stark-transcript/*|\
                crates/stateful-hasher/*)
                  run=true
                  break
                  ;;
              esac
            done < <(git diff --name-only -z "${BASE_SHA}...${HEAD_SHA}")
          fi

          echo "run=${run}" >> "${GITHUB_OUTPUT}"

  test:
    name: test on warpbuild
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      # Do not pin taiki-e's moving tool shortcut tags by hash. Pin a released
      # install-action commit and set tool explicitly, or zizmor's
      # impostor-commit audit can flag stale shortcut-tag hashes.
      - name: Install nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Build tests
        run: make test-build NEXTEST_PROFILE=ci
      - name: test
        run: make test NEXTEST_PROFILE=ci
      - name: Build core library and generate documentation
        run: |
          # Build core library with documentation generation enabled
          MIDEN_BUILD_LIB_DOCS=1 cargo build -p miden-core-lib
      - name: Check for documentation changes in crates/lib/core/docs
        run: |
          if [ -n "$(git status --porcelain crates/lib/core/docs)" ]; then
            echo "ERROR: Found uncommitted changes in crates/lib/core/docs/"
            echo "This indicates that the assembly source code has changed but the documentation was not updated."
            echo "Please commit the generated documentation changes before merging."
            echo ""
            echo "To fix this:"
            echo "1. Run: MIDEN_BUILD_LIB_DOCS=1 cargo build -p miden-core-lib"
            echo "2. Commit the changes in crates/lib/core/docs/"
            echo ""
            echo "Uncommitted changes:"
            git status crates/lib/core/docs
            echo ""
            echo "Diff:"
            git diff crates/lib/core/docs
            exit 1
          else
            echo "No documentation changes in crates/lib/core/docs/ - OK"
          fi

  crypto-test:
    name: crypto test on warpbuild
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Run crypto tests
        run: make test-crypto

  eidos-x86-backends:
    name: Eidos x86 backends
    needs: classify-eidos-paths
    if: needs.classify-eidos-paths.outputs.run == 'true'
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect runner CPU
        run: |
          set -euo pipefail

          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::Eidos backend tests require an x86-64 runner"
            exit 1
          fi

          lscpu
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Install nextest
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest
      - name: Check every Eidos x86 backend
        # `cfg(test)` keeps otherwise-gated helpers alive, so the plain library build has to be
        # checked on its own: once with runtime dispatch (`std`) and once with compile-time backend
        # selection (`no_std`).
        run: |
          set -uo pipefail

          check_backend() {
            local backend="$1"
            local target_features="$2"
            local required_target_features="$3"
            local forbidden_target_features="$4"
            local cpu_features
            local rust_cfg

            cpu_features=" $(awk -F: '/^flags[[:space:]]*:/{print $2; exit}' /proc/cpuinfo) "
            for feature in ${required_target_features}; do
              if [[ "${cpu_features}" != *" ${feature} "* ]]; then
                echo "::error::Runner does not expose ${backend} CPU feature '${feature}'"
                return 1
              fi
            done

            rust_cfg="$(rustc --print cfg -C "target-feature=${target_features}")" || return 1
            printf '%s\n' "${rust_cfg}"
            for feature in ${required_target_features}; do
              if ! grep -Fqx "target_feature=\"${feature}\"" <<<"${rust_cfg}"; then
                echo "::error::Rust did not enable required target feature '${feature}'"
                return 1
              fi
            done
            for feature in ${forbidden_target_features}; do
              if grep -Fqx "target_feature=\"${feature}\"" <<<"${rust_cfg}"; then
                echo "::error::Rust unexpectedly enabled target feature '${feature}'"
                return 1
              fi
            done
            echo "Configured Eidos target: ${backend}"

            RUSTFLAGS="-D warnings -C target-feature=${target_features}" \
              cargo check -p miden-crypto --all-targets || return 1
            RUSTFLAGS="-D warnings -C target-feature=${target_features}" \
              cargo check -p miden-crypto --lib --no-default-features || return 1

            # Disabling the crate's `std` feature makes target features select the exact backend.
            RUSTFLAGS="-C target-feature=${target_features}" \
              cargo nextest run --profile ci -p miden-crypto --lib --no-default-features \
                --no-tests=fail 'hash::eidos::' || return 1
          }

          failed=0
          if ! check_backend SSE2 '-avx2,-avx512f,-avx512vl' \
            'sse2' 'avx2 avx512f avx512vl'; then
            failed=1
          fi
          if ! check_backend AVX2 '+avx2,-avx512f,-avx512vl' \
            'avx2' 'avx512f avx512vl'; then
            failed=1
          fi
          if ! check_backend AVX-512F/VL '+avx2,+avx512f,+avx512vl' \
            'avx2 avx512f avx512vl' ''; then
            failed=1
          fi
          exit "${failed}"

  doc-tests:
    name: doc-tests
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Run doc-tests
        run: make test-docs

  check-constraints:
    name: check recursive constraint artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Check recursive constraint artifacts for drift
        run: make check-constraints

  check-pvm-registry:
    name: check PVM registry and MASM artifacts
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Check PVM registry and MASM artifacts for drift (full 10! recompute)
        run: make check-pvm-registry

  run-examples:
    name: run masm examples
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - name: Run masm examples
        run: make run-examples

  check-features:
    name: check all feature combinations
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      # Keep this on a released install-action commit with an explicit tool; see
      # the nextest install above for the zizmor/tool-shortcut rationale.
      - name: Install cargo-hack
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-hack
      - name: Check all feature combinations
        run: make check-features
