# Runs build related jobs.

name: build

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  no-std:
    name: Build for no-std
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Build for no-std
        run: |
          rustup update --no-self-update ${{ matrix.toolchain }}
          rustup +${{ matrix.toolchain }} target add wasm32-unknown-unknown
          rustup default ${{ matrix.toolchain }}
          make build-no-std

  target-miden:
    name: Build for Miden target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Build for Miden target
        run: |
          rustup toolchain install --no-self-update
          rustup target add wasm32-wasip2
          make build-target-miden

  wasm-simd-runtime:
    name: WASM SIMD128 runtime check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add wasm32-wasip1
      - name: Install cargo-binstall
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-binstall
      - name: Install wasmtime
        run: cargo binstall --no-confirm --strategies crate-meta-data wasmtime-cli@45.0.2
      - name: Run packed Goldilocks/Poseidon2 vs scalar tests under WASM SIMD128
        run: make test-wasm-simd

  fuzz-check:
    name: Check fuzz workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          # We need to explicitly cache the tools/miden-core-fuzz workspace, as only the root workspace is
          # cached by default.
          workspaces: |
            .
            tools/miden-core-fuzz
            tools/miden-crypto-fuzz
            tools/miden-serde-utils-fuzz
      - name: Check fuzz workspaces
        run: make check-fuzz
