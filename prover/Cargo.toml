[package]
name = "miden-prover"
version.workspace = true
description = "Miden VM prover"
documentation = "https://docs.rs/miden-prover"
readme = "README.md"
categories = ["cryptography", "emulators", "no-std"]
keywords = ["miden", "prover", "stark", "zkp"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[features]
default = ["std"]
concurrent = [
    "std",
    "miden-vm-stark/concurrent",
    "miden-precompile-stark/concurrent",
    "miden-processor/concurrent",
]
std = [
    "miden-precompiles/std",
    "miden-precompile-stark/std",
    "miden-vm-stark/std",
    "miden-processor/std",
    "thiserror/std",
]

[dependencies]
# Miden dependencies
miden-core.workspace = true
miden-precompiles.workspace = true
miden-precompile-stark = { workspace = true, features = ["prover"] }
miden-vm-stark = { workspace = true, features = ["prover"] }
miden-processor.workspace = true

# External dependencies
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
miden-air.workspace = true
miden-air-definitions.workspace = true
miden-crypto.workspace = true
miden-stark.workspace = true
rayon.workspace = true
miden-assembly.workspace = true
miden-debug-types = { workspace = true, features = ["std"] }
miden-verifier = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt"] }
miden-core = { workspace = true, features = ["testing"] }
