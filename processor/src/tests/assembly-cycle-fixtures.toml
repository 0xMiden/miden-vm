# Assembly instruction cycle fixtures measured with clk.
# Source of truth for assembly cycle fixtures (shared by processor tests and scripts/check_user_doc_cycles.py).
# See processor::tests::user_doc_assembly_cycle_fixtures_match_documentation and issue #3111.
#
# Cases with `doc` + `marker` are also checked against assembly user docs.
# Cases without those fields are core-lib-only: still measured here, and referenced from
# scripts/user-doc-cycle-mappings.toml via `fixture_id`.

[[case]]
id = "u32popcnt"
doc = "docs/src/user_docs/assembly/u32_operations.md"
marker = "u32popcnt"
program = "clk push.7 u32popcnt drop clk swap sub"
baseline_program = "clk push.7 drop clk swap sub"
expected = "38 cycles"

[[case]]
id = "u32popcnt-instruction-reference"
doc = "docs/src/user_docs/assembly/instruction_reference.md"
marker = "u32popcnt"
program = "clk push.7 u32popcnt drop clk swap sub"
baseline_program = "clk push.7 drop clk swap sub"
expected = "38"

# Core-lib mmr::num_leaves_to_num_peaks: measured in miden-core-lib tests
# (`test_num_leaves_to_num_peaks_cycle_count`), not here — processor must not depend on
# unpublished miden-core-lib for crates.io package dry-run.
# No assembly doc marker: used by scripts/user-doc-cycle-mappings.toml via fixture_id.
# `program` documents the measured shape; expected stays the source of truth for the checker.
[[case]]
id = "num_leaves_to_num_peaks"
program = "clk push.7 exec.mmr::num_leaves_to_num_peaks drop clk swap sub"
baseline_program = "clk push.7 drop clk swap sub"
expected = "46"
