[package]
name = "miden-processor"
version.workspace = true
description = "Miden VM processor"
documentation = "https://docs.rs/miden-processor"
readme = "README.md"
categories = ["emulators", "no-std"]
keywords = ["miden", "virtual-machine"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
exclude = ["*.snap"]

[lib]
bench = false
doctest = false

[features]
concurrent = ["std", "miden-air-definitions/concurrent"]
default = ["std"]
std = [
    "miden-air-definitions/std",
    "dep:rayon",
    "p3-maybe-rayon/parallel",
    "miden-core/std",
    "miden-debug-types/std",
    "miden-utils-diagnostics/std",
    "thiserror/std",
]
testing = ["arbitrary", "miden-air-definitions/testing"]
arbitrary = ["dep:proptest", "miden-air-definitions/arbitrary", "miden-core/arbitrary"]

[dependencies]
proptest = { workspace = true, optional = true }
# Miden dependencies
miden-ace.workspace = true
miden-stark.workspace = true
miden-air-definitions.workspace = true
miden-core.workspace = true
miden-debug-types.workspace = true
miden-mast-package.workspace = true
miden-precompiles.workspace = true
miden-utils-diagnostics.workspace = true
miden-utils-indexing.workspace = true

# External dependencies
itertools.workspace = true
paste.workspace = true
p3-maybe-rayon.workspace = true
rayon = { workspace = true, optional = true }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
miden-air.workspace = true
miden-vm-stark = { workspace = true, features = ["std"] }
miden-air-definitions = { workspace = true, features = ["testing"] }
miden-assembly = { workspace = true, features = ["testing"] }
miden-test-serialization-macros.workspace = true
miden-core = { workspace = true, features = ["arbitrary"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber.workspace = true
miden-utils-testing.workspace = true
insta.workspace = true
pretty_assertions = { workspace = true, features = ["std"] }
proptest.workspace = true
rand = { workspace = true, features = ["std", "thread_rng"] }
rstest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
