[package]
name = "miden-air"
version.workspace = true
description = "Algebraic intermediate representation of Miden VM processor"
documentation = "https://docs.rs/miden-air"
readme = "README.md"
categories = ["cryptography", "no-std"]
keywords = ["air", "arithmetization", "crypto", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
bench = false
doctest = false

[features]
default = ["std"]
compiler = ["miden-air-definitions/compiler"]
arbitrary = ["std", "miden-air-definitions/arbitrary"]
std = ["miden-air-definitions/std"]
concurrent = ["std", "miden-air-definitions/concurrent", "miden-lifted-stark/concurrent"]
testing = ["arbitrary", "miden-air-definitions/testing"]

[dependencies]
miden-air-definitions.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
miden-lifted-stark.workspace = true

[dev-dependencies]
insta.workspace = true
miden-ace-codegen = { workspace = true, features = ["testing"] }
miden-constraint-compiler.workspace = true
p3-field.workspace = true
proptest.workspace = true
