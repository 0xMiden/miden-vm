[package]
name = "miden-air"
version.workspace = true
description = "Production VM and precompile AIRs and build-generated artifacts"
documentation = "https://docs.rs/miden-air"
readme = "README.md"
categories = ["cryptography", "no-std"]
keywords = ["air", "arithmetization", "crypto", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
bench = false
doctest = false

[features]
default = ["std"]
compiler = ["miden-air-definitions/compiler", "miden-ace-codegen/compiler"]
arbitrary = ["std", "miden-air-definitions/arbitrary"]
std = ["miden-air-definitions/std", "miden-core/std"]
concurrent = ["miden-air-definitions/concurrent", "std", "miden-crypto/concurrent", "miden-lifted-stark/concurrent"]
testing = ["arbitrary", "miden-air-definitions/testing"]

[package.metadata.cargo-shear]
# The build-generated constraint evaluators import `p3_field::Dup`.
ignored = ["p3-field"]

[dependencies]
# Miden dependencies
miden-ace-codegen.workspace = true
miden-air-definitions.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
miden-lifted-air.workspace = true
miden-lifted-stark.workspace = true

# External dependencies
p3-field.workspace = true
p3-challenger.workspace = true
p3-security.workspace = true

[dev-dependencies]
miden-air-definitions = { workspace = true, features = ["compiler", "testing"] }
insta.workspace = true
miden-ace-codegen = { workspace = true, features = ["testing"] }
miden-constraint-compiler.workspace = true

[build-dependencies]
miden-air-definitions = { workspace = true, features = ["std", "compiler"] }
miden-ace-codegen = { workspace = true, features = ["compiler"] }
miden-core.workspace = true
miden-constraint-compiler.workspace = true
