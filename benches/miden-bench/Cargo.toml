[package]
description            = "Profiling binary for lifted STARK and batch STARK provers."
edition.workspace      = true
homepage.workspace     = true
license.workspace      = true
name                   = "miden-bench"
publish                = false
readme.workspace       = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[dependencies]
# Internal
miden-core.workspace = true
miden-stark = { features = ["testing"], workspace = true }

# Plonky3
p3-air.workspace           = true
p3-batch-stark.workspace   = true
p3-blake3.workspace        = true
p3-blake3-air.workspace    = true
p3-challenger.workspace    = true
p3-commit.workspace        = true
p3-dft.workspace           = true
p3-field.workspace         = true
p3-fri.workspace           = true
p3-keccak.workspace        = true
p3-keccak-air.workspace    = true
p3-lookup.workspace        = true
p3-matrix.workspace        = true
p3-merkle-tree.workspace   = true
p3-symmetric.workspace     = true
p3-uni-stark.workspace     = true

# Third-party
clap.workspace               = true
postcard.workspace           = true
rand.workspace               = true
tracing.workspace            = true
tracing-forest               = { features = ["ansi", "smallvec"], workspace = true }
tracing-subscriber.workspace = true

[dev-dependencies]
criterion.workspace             = true

[features]
concurrent = ["miden-stark/concurrent"]
default    = []

[[bench]]
harness = false
name    = "quotient_commit"

[[bench]]
harness = false
name    = "merkle_commit"

[[bench]]
harness = false
name    = "deep_quotient"

[[bench]]
harness = false
name    = "pcs"

[[bench]]
harness = false
name    = "pcs_trace"

[[bench]]
harness = false
name    = "per_air_degree_opt"

[lints]
workspace = true
