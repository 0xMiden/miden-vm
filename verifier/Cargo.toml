[package]
name = "miden-verifier"
version = "1.0.0"
description = "Miden VM execution verifier"
documentation = "https://docs.rs/miden-verifier"
readme = "README.md"
categories = ["cryptography", "no-std"]
keywords = ["miden", "stark", "verifier", "zkp"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
bench = false
doctest = false

[features]
default = ["std"]
std = [
    "miden-core/std",
    "miden-precompiles/std",
    "miden-precompile-stark/std",
    "miden-vm-stark/std",
    "thiserror/std",
]

[dependencies]
# Miden dependencies
miden-core.workspace = true
miden-stark.workspace = true
miden-precompiles.workspace = true
miden-precompile-stark.workspace = true
miden-vm-stark.workspace = true

# External dependencies
thiserror.workspace = true

[dev-dependencies]
miden-air.workspace = true
