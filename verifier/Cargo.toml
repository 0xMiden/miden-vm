[package]
name = "miden-verifier"
version.workspace = true
description = "Miden VM execution verifier"
documentation = "https://docs.rs/miden-verifier"
readme = "README.md"
categories = ["cryptography", "no-std"]
keywords = ["miden", "stark", "verifier", "zkp"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
bench = false
doctest = false

[features]
default = ["std"]
masm = ["std", "dep:miden-air", "dep:miden-assembly", "dep:miden-core-lib", "dep:miden-processor"]
std = [
    "miden-core/std",
    "miden-precompiles/std",
    "miden-precompiles-stark/std",
    "miden-vm-stark/std",
    "thiserror/std",
]

[dependencies]
# Miden dependencies
miden-air = { workspace = true, optional = true }
miden-core.workspace = true
miden-core-lib = { workspace = true, optional = true, features = ["std"] }
miden-stark.workspace = true
miden-precompiles.workspace = true
miden-precompiles-stark.workspace = true
miden-processor = { workspace = true, optional = true, features = ["std"] }
miden-vm-stark.workspace = true

# External dependencies
thiserror.workspace = true

[dev-dependencies]
miden-air.workspace = true

[build-dependencies]
miden-assembly = { workspace = true, optional = true, features = ["std"] }
miden-core-lib = { workspace = true, optional = true, features = ["std"] }

[lints]
workspace = true
