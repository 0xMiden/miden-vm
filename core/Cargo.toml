[package]
"name" = "miden-core"
"version" = "1.0.0"
"description" = "Miden VM core components"
"documentation" = "https://docs.rs/miden-core"
"readme" = "README.md"
"categories" = ["emulators", "no-std"]
"keywords" = ["instruction-set", "miden", "program"]
"license" = { "workspace" = true }
"authors" = { "workspace" = true }
"homepage" = { "workspace" = true }
"repository" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"edition" = { "workspace" = true }
"exclude" = ["*.snap"]
"metadata" = { "cargo-shear" = { "ignored-paths" = ["tests/ui/**"] } }

[lib]
"bench" = false
"doctest" = false

[[bench]]
"name" = "mast_forest_merge"
"required-features" = ["arbitrary"]
"harness" = false
[[bench]]
"name" = "mast_serialization_size"
"required-features" = ["arbitrary"]
"harness" = false

[features]
"default" = ["std"]
"std" = ["miden-crypto/std", "miden-debug-types/std", "miden-formatting/std", "miden-serde-utils/std", "miden-utils-indexing/std", "miden-utils-sync/std", "thiserror/std"]
"arbitrary" = ["dep:proptest", "miden-crypto/arbitrary"]
"testing" = ["arbitrary"]
"fuzzing" = []

[dependencies]
"miden-crypto" = { "workspace" = true }
"miden-debug-types" = { "workspace" = true }
"miden-formatting" = { "workspace" = true }
"miden-serde-utils" = { "workspace" = true }
"miden-utils-core-derive" = { "workspace" = true }
"miden-utils-indexing" = { "workspace" = true }
"miden-utils-sync" = { "workspace" = true }
"derive_more" = { "workspace" = true }
"log" = { "workspace" = true }
"proptest" = { "workspace" = true, "optional" = true }
"thiserror" = { "workspace" = true }
"p3-matrix" = { "workspace" = true }

[dev-dependencies]
"criterion" = { "workspace" = true }
"miden-crypto" = { "workspace" = true, "features" = ["arbitrary"] }
"insta" = { "workspace" = true }
"miden-test-serialization-macros" = { "workspace" = true }
"proptest" = { "workspace" = true }
"rand" = { "workspace" = true, "features" = ["std", "thread_rng"] }
"rand_chacha" = { "workspace" = true }
"rstest" = { "workspace" = true }
"trybuild" = { "workspace" = true }
