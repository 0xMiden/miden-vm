name: Coverage comment

on:
  workflow_call:
    inputs:
      run_id:
        description: The id of the workflow run that produced the coverage report
        required: true
        type: string

permissions: {}

jobs:
  comment:
    name: attach coverage report comment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Read report artifact
      issues: write # Needed by GitHub to write comment to PR
      pull-requests: write # Write comment to PR
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-comment
          path: ${{ runner.temp }}/coverage
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update pull request coverage comment
        uses: actions/github-script@v9.0.0
        env:
          COVERAGE_ARTIFACT: ${{ runner.temp }}/coverage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await require(process.env.GITHUB_WORKSPACE + '/.github/scripts/coverage-comment.js')({ github, context, core });
